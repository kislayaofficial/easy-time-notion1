<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy Time Manager</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .card{
    width:min(360px,92vw);
    padding:24px;
    border:1px solid rgba(120,120,120,.18);
    border-radius:20px;
    background:rgba(255,255,255,.88);
    box-shadow:0 8px 28px rgba(0,0,0,.08);
    text-align:center;
  }
  .icon{
    width:64px;height:64px;margin:0 auto 14px;
    display:grid;place-items:center;
    border-radius:18px;
    background:#f1f1f1;
    font-size:34px;
  }
  h1{margin:0 0 6px;font-size:19px;font-weight:650;color:#222}
  p{margin:0 0 18px;font-size:13px;color:#777}
  button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:12px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    background:#222;
    color:white;
  }
  button:hover{opacity:.88}
  .note{margin-top:10px;font-size:11px;color:#999}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⏱️</div>
    <h1>Easy Time Manager</h1>
    <p>Учёт времени и таймер</p>
    <button onclick="openEasyTime()">Открыть приложение</button>
    <div class="note">При запросе Windows разреши открытие приложения.</div>
  </div>

<script>
function openEasyTime(){
  window.open("easytime://", "_blank");
}
</script>
</body>
</html>
